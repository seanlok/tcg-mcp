name: Publish to PyPI

# Triggered when a GitHub Release is published.
#
# Uses PyPI Trusted Publishing (OIDC) — NO API token in this repo and NO
# secret stored in GitHub Secrets. To enable:
#   1. Reserve "tcg-mcp" on https://pypi.org/manage/account/publishing/
#      with: GitHub Repository = seanlok/tcg-mcp, workflow = publish.yml,
#      environment = pypi.
#   2. Tag a release on GitHub matching the pyproject.toml version
#      (e.g. v0.2.0). The first publish will mint the package.

on:
  release:
    types: [published]

permissions:
  id-token: write   # required for OIDC trusted publishing
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::pyproject.toml version $PKG_VERSION does not match tag $TAG_VERSION"
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
