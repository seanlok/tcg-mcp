[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tcg-mcp"
version = "0.2.0"
description = "MCP server for Pokemon TCG: PSA grading lookups, local collection management, and multi-provider pricing (Pokemon TCG API + PriceCharting)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sean Lok" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "psa",
    "trading-cards",
    "grading",
    "pokemon",
    "pricecharting",
    "tcgplayer",
    "claude",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
]

[project.scripts]
tcg-mcp = "tcg_mcp.server:main"

[project.urls]
Homepage = "https://github.com/seanlok/tcg-mcp"
Documentation = "https://github.com/seanlok/tcg-mcp#readme"
Repository = "https://github.com/seanlok/tcg-mcp.git"
Issues = "https://github.com/seanlok/tcg-mcp/issues"
Changelog = "https://github.com/seanlok/tcg-mcp/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/tcg_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
